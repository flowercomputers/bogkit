[package]
name = "bog-cloud"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"

[dev-dependencies]
tempfile = "3"
