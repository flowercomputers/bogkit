<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bog notebook</title><style>
body{font:20px/1.5 Georgia,serif;background:#eeebee;color:#191919;margin:4vw}main{max-width:48rem;margin:auto}h1,h2,input,button,textarea,select{font:inherit}input,textarea{box-sizing:border-box;width:100%;padding:.6em;background:transparent;border:1px solid #aaa;border-radius:12px}button,select{padding:.5em .8em;border:1px solid #aaa;border-radius:12px}button{cursor:pointer}form,section{margin:2em 0}article{border:1px solid #aaa;border-radius:16px;padding:1em;margin:1em 0;white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:.7em 0}#status{min-height:1.5em}button[type=submit]{background:#191919;color:#eeebee}
</style><main><h1>Bog notebook</h1><p>Notes persist in your Bog. Search by words or meaning.</p><form id="note"><label>Title<input id="title" required maxlength="300"></label><label>Note<textarea id="body" required rows="4"></textarea></label><button type="submit">Save note</button></form><form id="search"><label>Search<input id="query" required></label><select id="mode" aria-label="Search mode"><option value="semantic">Meaning</option><option value="words">Words</option></select> <button type="submit">Search</button> <button id="all" type="button">All notes</button></form><p>Meaning returns the closest neighbors, not confidence scores. Words uses token matching.</p><p id="status" role="status"></p><section id="notes" aria-label="Notes"></section></main><script>
const $=id=>document.getElementById(id);async function api(path,options){const r=await fetch(path,options);const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}function show(records){$('notes').replaceChildren();for(const r of records){const a=document.createElement('article');const v=r.value||r.data||{};a.textContent=(v.title||v['/title']||r.key||'Note')+'\n'+(v.body||v['/body']||'');$('notes').append(a)}$('status').textContent=records.length+' results'}async function all(){try{const v=await api('/api/notes');show(v.data)}catch(e){$('status').textContent=e.message}}$('note').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await api('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:crypto.randomUUID(),title:$('title').value,body:$('body').value})});$('note').reset();await all()}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};$('search').onsubmit=async e=>{e.preventDefault();try{const v=await api('/api/search?'+new URLSearchParams({q:$('query').value,mode:$('mode').value}));const hits=Array.isArray(v.data)?v.data:v.data.hits;show(hits)}catch(e){$('status').textContent=e.message}};$('all').onclick=all;all();
</script></html>
