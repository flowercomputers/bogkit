[package]
name = "bog-cloud-records"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
bog-serve = { path = "../serve" }
fold = { path = "../fold" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }

[dev-dependencies]
http-body-util = "0.1"
postcard = { version = "1", features = ["use-std"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
