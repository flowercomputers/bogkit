[package]
name = "bog-cloud-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bog-cloud = { path = "../cloud" }
axum = "0.8"
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
