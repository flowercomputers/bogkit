[package]
name = "bog-serve"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anny = { path = "../anny" }
axum = "0.8"
fold = { path = "../fold" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
# macros spelled out here: the workspace unifies tokio features today, but
# this crate's tests must also build standalone once published
tokio = { version = "1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
