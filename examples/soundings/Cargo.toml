[package]
name = "soundings"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
anny = { path = "../../anny" }
fold = { path = "../../fold" }
ese = { path = "../../ese", features = ["dim-512", "quant-8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
