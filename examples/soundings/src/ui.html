<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soundings</title>
<style>
  :root {
    --paper: #f6f1e7; --ink: #2a251d; --faint: #8a7f6d; --line: #d8cfbd;
    --card: #fffdf7; --cool: #3f6079; --warm: #a1701c; --moss: #4a6b4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', serif;
  }
  .page {
    display: grid; grid-template-columns: 1fr minmax(0, 640px) 300px 1fr;
    gap: 28px; padding: 48px 24px 120px;
  }
  main { grid-column: 2; }
  aside { grid-column: 3; }
  h1 { font-size: 20px; font-weight: normal; letter-spacing: .04em; margin: 0 0 2px; }
  .sub { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--faint); margin-bottom: 22px; }
  .chips { display: flex; gap: 8px; margin-bottom: 6px; }
  .chip {
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--faint);
    padding: 4px 10px; border-radius: 999px;
  }
  .chip.on { color: var(--ink); border-color: var(--ink); }
  .lenskey { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--faint); min-height: 16px; margin-bottom: 26px; }
  #doc { font-size: 18.5px; line-height: 1.85; }
  #doc .para { margin: 0 0 15px; }
  .s {
    cursor: pointer; border-radius: 3px; padding: 1px 2px;
    transition: background .25s ease;
  }
  .s:hover { text-decoration: underline dotted var(--faint); text-underline-offset: 4px; }
  .s.sel { outline: 1px solid var(--line); }
  .editbox { margin: 10px 0; }
  .editbox textarea {
    width: 100%; font: inherit; font-size: 17px; line-height: 1.6;
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 10px; resize: vertical; min-height: 66px;
  }
  .editbox .row { display: flex; gap: 8px; margin-top: 6px; }
  .editbox button {
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 4px 12px; border-radius: 3px;
  }
  .editbox button.danger { color: #8c3b2e; margin-left: auto; }
  #composer {
    width: 100%; font: inherit; font-size: 18.5px; line-height: 1.7;
    background: transparent; color: var(--ink); border: none; outline: none;
    resize: none; min-height: 58px; padding: 1px 2px; margin-top: 2px;
  }
  #composer::placeholder { color: var(--faint); font-style: italic; font-size: 15px; }
  .page.galing #composer { display: none; }
  .lane { position: sticky; top: 48px; }
  .lanehead { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .12em; color: var(--faint); text-transform: uppercase; margin-bottom: 10px; }
  #voice .hit { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; }
  #voice .hit .t { font-size: 13.5px; line-height: 1.5; }
  #voice .hit .m { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--faint); margin-top: 6px; }
  #voice .empty { font-size: 12.5px; color: var(--faint); font-style: italic; line-height: 1.6; }
  /* the instrument plate — black-and-amber, numbers that cannot be faked.
     tokens from docs/corrigenda-and-chalk.html `.plate` */
  #hud {
    --pl-bg: #15110B; --pl-amber: #E5B54B; --pl-cream: #EFE7D2; --pl-dim: #8D7B4F; --pl-crim: #E0554A;
    --pl-line: rgba(229,181,75,.35);
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; gap: 4px;
    font-family: Menlo, 'SF Mono', ui-monospace, monospace; font-size: 11px; line-height: 1.55;
    font-variant-numeric: tabular-nums;
    background: var(--pl-bg); color: var(--pl-cream); padding: 7px 16px 7px;
    border-top: 1px solid var(--pl-line);
  }
  #hud .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 18px; }
  #hud .row.ledger { color: var(--pl-dim); font-size: 10px; gap: 18px; }
  #hud .row.ledger .canon { margin-left: auto; color: var(--pl-cream); }
  #hud .head {
    font-family: 'American Typewriter', 'Courier New', Courier, monospace;
    font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--pl-dim);
    padding-right: 6px; border-right: 1px solid var(--pl-line); margin-right: 2px;
  }
  #hud .head .op { color: var(--pl-amber); }
  #hud .head .op.retract { color: var(--pl-crim); }
  #hud .head .op.resume { color: var(--pl-cream); }
  #hud .arrow { color: var(--pl-dim); }
  #hud .stage { border: 1px solid var(--pl-line); border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
  #hud .stage b, #hud b { color: var(--pl-amber); font-weight: 600; }
  #hud .stage .neg { color: var(--pl-crim); }
  #hud .wall { margin-left: auto; white-space: nowrap; }
  #hud .stage .lbl { color: var(--pl-dim); font-size: 9px; letter-spacing: .06em; }
  #hud .wall .note { color: var(--pl-dim); font-size: 9.5px; margin-left: 10px; }
  #hud .ledger .entry { white-space: nowrap; }
  #hud .ledger .entry .n { color: var(--pl-dim); }
  #hud .ledger .entry.newest { color: var(--pl-cream); }
  #hud .ledger .entry.newest .n { color: var(--pl-amber); }
  #hud .ledger .entry .retract { color: var(--pl-crim); }
  #hud .dead { color: var(--pl-crim); }
  #hud .empty { color: var(--pl-dim); }
  @media (max-width: 1020px) { .page { grid-template-columns: 1fr; } main, aside { grid-column: 1; } .lane { position: static; } }

  /* ---- gale (G5): split lanes, instrument tiles, referee line, moral card ---- */
  .page { grid-template-rows: auto auto auto; }
  main, aside, #naivelane { grid-row: 2; }
  #galechip {
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; cursor: pointer;
    border: 1px dashed var(--line); background: none; color: var(--faint);
    padding: 4px 10px; border-radius: 999px; margin-left: 6px;
  }
  #galechip:hover { color: var(--ink); border-color: var(--ink); }
  #galechip[disabled] { cursor: default; opacity: .55; }
  .page.galing { grid-template-columns: 1fr minmax(0, 560px) minmax(0, 560px) 1fr; }
  .page.galing aside { display: none; }
  #galebar { display: none; grid-column: 2 / 4; grid-row: 1; align-items: center; gap: 14px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--faint); margin-bottom: 8px; }
  .page.galing #galebar { display: flex; }
  #galebar b { color: var(--ink); font-weight: normal; }
  #galebar .track { flex: 1; height: 2px; background: var(--line); position: relative; }
  #galebar .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
  #naivelane { display: none; grid-column: 3; }
  .page.galing #naivelane { display: block; }
  .lanetitle { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 4px; }
  .lanetitle.naive { color: #8c3b2e; }
  .lanenote { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--faint); min-height: 14px; margin-bottom: 26px; }
  #naivedoc { font-size: 18.5px; line-height: 1.85; opacity: .78; }
  #naivedoc .s.stale { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.07) 0 3px, transparent 3px 6px); }

  .page.galing #naivelane, .page.galing main { padding-top: 0; }
  /* instrument tiles — the board's black-and-amber plate */
  .tile { display: none; margin-top: 26px; background: #15110B; color: #EFE7D2; border: 1px solid #E5B54B; border-radius: 4px;
    font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; overflow: hidden; }
  .page.galing .tile { display: block; }
  .tile .th { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: #A8925B; padding: 6px 12px; border-bottom: 1px solid rgba(229,181,75,.35); }
  .tile .tb { display: flex; gap: 22px; padding: 10px 12px 12px; flex-wrap: wrap; }
  .tile .k { font-size: 9px; letter-spacing: .1em; color: #8D7B4F; text-transform: uppercase; }
  .tile .v { font-size: 19px; color: #E5B54B; line-height: 1.2; }
  .tile .v.crim { color: #E0554A; }
  .tile .v.dim { color: #8D7B4F; }
  #referee { display: none; grid-column: 2 / 4; grid-row: 3; margin-top: 12px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink); line-height: 1.7; }
  .page.galing #referee { display: block; }
  #referee .fn { color: var(--faint); font-size: 10.5px; }
  #referee .ok { color: #1D5C49; }
  #referee .bad { color: #8c3b2e; }
  /* moral card */
  #moral { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; background: rgba(246,241,231,.72); z-index: 20; }
  #moral.show { display: flex; }
  #moral .card { background: var(--card); border: 1px solid #cfc6b4; border-radius: 6px; box-shadow: 0 12px 40px rgba(40,30,10,.18);
    padding: 26px 30px 22px; max-width: 620px; font-size: 16px; line-height: 1.6; }
  #moral .card h2 { font-weight: normal; font-size: 22px; margin: 0 0 10px; letter-spacing: .01em; }
  #moral .card .nums { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.8; margin: 8px 0 12px; }
  #moral .card .disc { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--faint); line-height: 1.6; border-top: 1px solid var(--line); padding-top: 10px; }
  #moral .card button { margin-top: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 4px 12px; border-radius: 3px; }
  /* ---- corrigendum (branch C): the line stays struck, never deleted ---- */
  /* correction crimson that never deletes: line-through so the rule follows the sentence across wrapped lines
     (the board’s rotated pseudo-element only works on a single-line box) */
  .ghost { color: #B7AC99; padding: 1px 2px; cursor: default; white-space: normal;
    text-decoration: line-through; text-decoration-color: #A2231F; text-decoration-thickness: 0.13em; text-decoration-skip-ink: none; }
  .ghost.fading { transition: opacity .6s ease; opacity: 0; }
  #corrigenda:empty { display: none; }
  #corrigenda { margin-bottom: 14px; }
  .chit { position: relative; background: #FBF7ED; border: 1px dashed #33567A; border-radius: 3px; padding: 9px 12px 8px;
    font-family: 'American Typewriter', 'Courier New', Courier, monospace; font-size: 11px; color: #4A4234; line-height: 1.55; margin-bottom: 8px; }
  .chit .hole { position: absolute; top: 9px; right: 10px; width: 10px; height: 10px; border-radius: 50%; background: #A2231F; border: 1.5px solid #A2231F; }
  .chit .ch-h { text-transform: uppercase; letter-spacing: .1em; color: #33567A; font-size: 10px; margin-bottom: 3px; padding-right: 18px; }
  .chit .ch-b { font-family: Georgia, 'Iowan Old Style', serif; font-size: 12px; color: #29231B; }
  .chit .ch-m { color: #8D8271; font-size: 10px; margin-top: 3px; }
  .chit .ch-row { display: flex; gap: 6px; margin-top: 7px; }
  .chit button { font-family: inherit; font-size: 10px; letter-spacing: .06em; cursor: pointer; background: transparent;
    border: 1px solid #B7AC99; color: #4A4234; border-radius: 2px; padding: 1px 7px; }
  .chit button.restore { color: #1D5C49; border-color: #1D5C49; }
  .chit button.restore:hover { background: #1D5C49; color: #FBF7ED; }
  .chit button.dismiss { margin-left: auto; }
  #voice .hit.released { opacity: .32; }
  #hud .head .op.restore { color: #6FBF9A; }

  /* ---- lens authoring (E): user lenses as chips, an inline authoring card ---- */
  .chip.dash { border-style: dashed; background: none; }
  .chip.user { display: inline-flex; align-items: center; gap: 6px; }
  .chip.user .hue { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); }
  .chip.user .x { margin-left: 2px; opacity: .55; padding: 0 2px; }
  .chip.user .x:hover { opacity: 1; color: #8c3b2e; }
  #lenscard { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px 9px; margin: 6px 0 12px; max-width: 540px; font-size: 13px; }
  #lenscard .lc-h { font-family: ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: .14em; color: var(--faint); margin-bottom: 4px; }
  #lenscard .lc-row { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; }
  #lenscard .lc-row .k { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--faint); width: 32px; flex: none; }
  #lenscard .lc-row input { flex: 1; font: inherit; font-size: 15px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 2px 0; color: var(--ink); outline: none; }
  #lenscard .lc-row input:focus { border-bottom-color: var(--ink); }
  #lenscard .lc-name input { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  #lenscard .lc-actions { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  #lenscard .lc-go { font-family: ui-monospace, Menlo, monospace; font-size: 11px; cursor: pointer; border: 1px solid var(--ink); background: var(--card); color: var(--ink); padding: 3px 10px; border-radius: 3px; }
  #lenscard .lc-note { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: var(--faint); }
  #lenscard.shake { animation: lcshake .32s ease; }
  @keyframes lcshake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }
  .page.galing #lenscard, .page.galing .chip.user, .page.galing #lensadd { display: none; }
  #hud .head .op.unlens { color: var(--pl-crim); }
  /* ---- gutter chips (D): felt latency beside the edited sentence + length percentile vs canon ---- */
  #doc { position: relative; }
  .gchip {
    position: absolute; left: -100px; width: 88px; text-align: right;
    font-family: ui-monospace, Menlo, monospace; line-height: 1.45; pointer-events: none;
    opacity: 1; transition: opacity 3s ease-in;
  }
  .gchip.fade { opacity: 0; }
  .gchip .us {
    display: inline-block; font-size: 11px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 0 6px;
  }
  .gchip .us .lbl { color: var(--faint); font-size: 8.5px; margin-left: 4px; letter-spacing: .06em; }
  .gchip .pct { display: block; font-size: 10px; color: var(--faint); margin-top: 3px; }
  .page.galing .gchip { display: none; }
  @media (max-width: 1020px) { .gchip { display: none; } }
</style>
</head>
<body>
<div class="page">
  <div id="galebar"></div>
  <main>
    <h1>Soundings</h1>
    <div class="sub">every edit is a fold delta · ese re-embeds in µs · kill me and relaunch — the doc survives</div>
    <div class="chips">
      <button class="chip" data-lens="off">plain</button>
      <button class="chip on" data-lens="axis">concrete —— abstract</button>
      <button class="chip" data-lens="len">length</button>
      <button id="galechip" title="replay scripted edits at 60/s for 10s against a naive full-rescan arm">▶ gale</button>
    </div>
    <div class="lenskey" id="lenskey"></div>
    <div id="doc"></div>
    <textarea id="composer" rows="2" placeholder="write here — finished sentences flow into the page as you go…"></textarea>
    <div class="tile" id="foldtile"></div>
  </main>
  <aside>
    <div class="lane">
      <div id="corrigenda"></div>
      <div class="lanehead" id="voicehead">Nearest voices</div>
      <div id="voice"><div class="empty">Click a sentence to hear which of 20 books it stands closest to.</div></div>
    </div>
  </aside>
  <section id="naivelane">
    <div class="lanetitle naive">Naive arm · full rescan</div>
    <div class="lanenote" id="naivenote"></div>
    <div id="naivedoc"></div>
    <div class="tile" id="naivetile"></div>
  </section>
  <div id="referee"></div>
</div>
<div id="moral"><div class="card" id="moralcard"></div></div>
<div id="hud"><div class="row" id="hudl"><span class="empty">connecting…</span></div><div class="row ledger" id="hudr"></div></div>

<script>
let state = { rows: [], hud: {} };
let canon = "";
let lens = "axis";
let selId = null, editId = null, adding = false;
let pending = false;

const $ = (id) => document.getElementById(id);

const LENSKEY = {
  off: "",
  axis: "cool wash = concrete, amber wash = abstract — projection onto a sentence-anchored axis",
  len: "deeper moss = longer sentence (words, relative to this document) · hover a line for its percentile vs 129,097 canon sentences",
};

function paint(r, maxW) {
  if (lens.startsWith("user:")) {
    // a runtime axis is not calibrated like the seeded one, so paint it
    // relative to THIS document: centred on the median projection, scaled to
    // the widest excursion (the length lens makes the same choice)
    const i = userLensIndex(+lens.slice(5));
    const t = i >= 0 && r.lens_t && r.lens_t.length > i ? r.lens_t[i] : 0.5;
    const { mid, span } = userLensScale(i);
    const d = span > 0 ? (t - mid) / span : 0, pr = LENS_PAIR(i);
    return d < 0 ? pr.cool(Math.min(0.34, -d * 0.34)) : pr.warm(Math.min(0.34, d * 0.34));
  }
  if (lens === "len") {
    const a = maxW ? (r.words / maxW) * 0.30 : 0;
    return `rgba(74,107,79,${a.toFixed(3)})`;
  }
  if (lens === "axis") {
    const d = r.t - 0.5;
    return d < 0
      ? `rgba(63,96,121,${Math.min(0.34, -d * 0.9).toFixed(3)})`
      : `rgba(161,112,28,${Math.min(0.34, d * 0.9).toFixed(3)})`;
  }
  return "transparent";
}

function render() {
  if (editId !== null || adding) { pending = true; return; }
  renderLensChips();
  $("lenskey").textContent = lensKey();
  const doc = $("doc");
  const maxW = Math.max(1, ...state.rows.map((r) => r.words));
  // sentences group into paragraphs; a change in r.para opens a new <p>
  doc.replaceChildren();
  let curP = null, lastPara = null;
  for (const r of state.rows) {
    if (curP === null || r.para !== lastPara) {
      curP = document.createElement("p");
      curP.className = "para";
      doc.appendChild(curP);
      lastPara = r.para;
    }
    const s = document.createElement("span");
    s.className = "s" + (r.id === selId ? " sel" : "");
    s.textContent = r.text + " ";
    s.style.background = paint(r, maxW);
    s.title = `t=${r.t.toFixed(2)} · ${r.words} words` + (r.pct != null ? ` · ${ordinal(r.pct)} pct of canon` : "");
    s.onclick = () => beginEdit(r);
    curP.appendChild(s);
  }
  renderGhosts(doc);
  renderChips(doc);
  renderHud();
}

// the ledger: last few ops, newest first — kept client-side from each hud
const LEDGER_MAX = 4;
let ledger = [];
let lastLedgerSeq = null;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// "keys 2 (−1 +1)" — deltas with their sign breakdown when it isn't all +
function deltaLabel(st) {
  if (!st) return "";
  const parts = [];
  if (st.retracts) parts.push(`<span class="neg">−${st.retracts}</span>`);
  if (st.inserts) parts.push(`+${st.inserts}`);
  const mixed = st.retracts && st.inserts;
  return mixed || st.retracts ? ` (${parts.join(" ")})` : "";
}

function renderHud() {
  const h = state.hud || {};
  const verbs = { seed: "seeded", resume: "RESUMED FROM DISK", upsert: "upsert", insert: "insert", retract: "retract", restore: "restored", lens: "lens authored", unlens: "lens retracted" };
  const l = $("hudl"), r = $("hudr");
  if (!h.op) {
    l.innerHTML = '<span class="empty">…</span>';
    r.innerHTML = `<span class="canon">${esc(canon)}</span>`;
    return;
  }
  const st = Object.fromEntries((h.stages || []).map((s) => [s.name, s]));
  const keys = st.keys || {}, embed = st.embed || {}, scored = st.scored || {};
  const untouched = Math.max(0, (h.rows || 0) - (h.keys || 0));
  const opClass = h.op === "retract" ? "retract" : h.op === "resume" ? "resume" : h.op === "restore" ? "restore" : h.op === "unlens" ? "unlens" : h.op === "lens" ? "lens" : "";
  const target = h.key != null ? ` s${h.key}` : "";
  const isResume = h.op === "resume";
  const isLensOp = h.op === "lens" || h.op === "unlens";
  const arrow = `<span class="arrow">→</span>`;
  // the tape is generic over h.stages: the doc taps keep their exact boxes,
  // any other tap (lens_keys, lens_scored, …) renders as name · deltas · µs
  const stageBox = (s) => {
    if (!s) return "";
    if (s.name === "keys") return `<span class="stage">keys <b>${s.deltas}</b>${deltaLabel(s)}</span>`;
    if (s.name === "embed") return `<span class="stage">embed <b>${s.deltas}</b> · <b>${s.us}</b>µs</span>`;
    if (s.name === "scored") return `<span class="stage">scored <b>${s.deltas}</b> rows</span>`;

  };
  const extra = (h.stages || []).filter((s) => !["keys", "embed", "scored"].includes(s.name));
  const tape = isResume
    ? `<span class="stage">keys <b>0</b></span>${arrow}` +

      `<span class="stage">scored <b>0</b> rows</span>` +

    : isLensOp

    `<span class="note">counted by Meter ops in the pipeline · wall = stopwatch</span></span>`;

  // ledger

      })

}

// The app's sentence splitter (same semantics as the corpus prep): terminal
// punctuation + closing quotes end a sentence; honorific abbreviations rejoin.
// A pasted paragraph becomes one add per sentence — one key per sentence is
// what keeps every downstream view incremental.
function splitSentences(text) {
  const out = [];
  for (const m of text.matchAll(/([^.!?]+[.!?”"]+)|([^.!?]+$)/g)) {
    const p = m[0].trim();
    if (!p) continue;
    if (out.length && /\b(Mr|Mrs|Ms|Dr|St)\.$/.test(out[out.length - 1])) {
      out[out.length - 1] += " " + p;
    } else {
      out.push(p);
    }
  }
  return out.length ? out : [text.trim()].filter(Boolean);
}

const composer = $("composer");

// whitespace — the writer moved on. Commit completed segments, keep the rest.
const DEFAULT_PH = composer.placeholder;
let pendingBreak = false;
function curPara() { return state.rows.length ? Math.max(...state.rows.map((r) => r.para || 0)) : 0; }
function harvest(force) {
  // a blank line is a paragraph break: chunks before the last are complete
  const chunks = composer.value.split(/\n\s*\n/);
  let base = curPara() + (pendingBreak ? 1 : 0);
  let committed = null;
  for (let ci = 0; ci < chunks.length - 1; ci++) {
    for (const sSeg of splitSentences(chunks[ci])) { send({ op: "add", text: sSeg, para: base }); committed = sSeg; }
    pendingBreak = false;
    base = curPara() + 1 + ci + 1;
  }
  const text = chunks[chunks.length - 1];
  const segs = splitSentences(text);
  let keep = "";
  if (segs.length && !force) {
    const last = segs[segs.length - 1];
    const done = /[.!?]["\u201d]?\s*$/.test(last) && !/\b(Mr|Mrs|Ms|Dr|St)\.$/.test(last.trim());
    const moved = /\s$/.test(text) || segs.length > 1;
    if (!done || !moved) keep = segs.pop();
    while (segs.length && /\b(Mr|Mrs|Ms|Dr|St)\.$/.test(segs[segs.length - 1].trim())) {
      keep = segs.pop() + (keep ? " " + keep : "");
    }
  }
  for (const sSeg of segs) { send({ op: "add", text: sSeg, para: base }); committed = sSeg; pendingBreak = false; }
  if (committed !== null || chunks.length > 1) {
    composer.value = keep;
    autogrow();
    composer.placeholder = DEFAULT_PH;

}

// ---- corrigendum (branch C): retract = strike, never delete ----
// A retracted sentence stays on the page as a struck ghost at its old
// position, a corrigendum chit pins into the margin with what fold rolled
// back, and the voice cards the lane fetched for it fade to "released".
// restore ↩ sends the un-retcon: one upsert on the old id, one mutation.
const GHOST_MAX = 3, GHOST_TTL_MS = 45000;

  clearTimeout(g.timer);

function renderGhosts(doc) {

  const h = state.hud || {};
  if (h.op === "retract" && h.key != null) {
    const g = ghosts.find((x) => x.id === h.key);
    if (g && g.seq !== h.seq) { g.seq = h.seq; g.wall_us = h.wall_us; renderCorrigenda(); }
  }
  // a restore (or any re-insert of the id) retires the ghost
  // …but only once the retract was confirmed (g.seq set) — the click-time render still has the row
  for (const g of [...ghosts]) if (g.seq != null && state.rows.some((r) => r.id === g.id)) dropGhost(g.id, false);
  const spans = [...doc.querySelectorAll(".s")];
  const rowIds = state.rows.map((r) => r.id);
  for (const g of ghosts) {
    const el = document.createElement("span");
    el.className = "ghost";
    el.dataset.id = g.id;
    el.textContent = g.text + " ";
    el.title = `s${g.id} withdrawn — the line stays struck, never deleted`;
    const idx = rowIds.findIndex((id) => id > g.id);
    if (idx >= 0 && spans[idx]) {
      spans[idx].parentNode.insertBefore(el, spans[idx]);

  box.replaceChildren(...[...ghosts].reverse().map((g) => {

  const orig = r3.text.replace(/ — hazards blinking\.$/, "."); // idempotent across runs
  setTimeout(() => send({ op: "edit", id: 3, text: orig.replace(/\.$/, "") + " — hazards blinking." }), 400);
  setTimeout(() => send({ op: "edit", id: 3, text: orig }), 9000); // leave the doc as it was
}

let voiceSeq = 0;
async function fetchVoice(text, forId) {
  const seq = ++voiceSeq;
  voiceForId = forId == null ? null : forId;
  const v = $("voice");
  // keep the previous hits on screen while following the pen — only show the
  // placeholder when the lane is empty, so live typing doesn't flicker
  if (!v.querySelector(".hit")) v.innerHTML = '<div class="empty">listening…</div>';
  try {
    const res = await fetch(`/voice?text=${encodeURIComponent(text)}`);
    const data = await res.json();
    if (seq !== voiceSeq) return;
    if (data.status !== "ok" || !data.hits.length) {
      v.innerHTML = '<div class="empty">canon still reshelving — try again in a moment.</div>';
      return;
    }
    v.replaceChildren(...data.hits.map((h) => {
      const d = document.createElement("div");
      d.className = "hit";
      d.innerHTML = `<div class="t"></div><div class="m"></div>`;
      d.querySelector(".t").textContent = h.text.length > 140 ? h.text.slice(0, 140) + "…" : h.text;
      d.querySelector(".m").textContent = `${h.title} · cos-dist ${h.score.toFixed(3)}`;
      return d;
    }));
  } catch { /* server gone; ws banner covers it */ }
}

// ---- gale (G5): two arms, one script, one clock ----
let naive = null, gale = null, galeDismissed = false;
const fmtUs = (us) => us == null ? "—" : us >= 1000 ? (us / 1000).toFixed(us >= 10000 ? 0 : 1) + "ms" : us + "µs";
const fmtS = (ms) => (ms / 1000).toFixed(1) + "s";
const clock = (ms) => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const tile = (head, cells) =>
  `<div class="th">${head}</div><div class="tb">` +
  cells.map(([k, v, cls]) => `<div><div class="k">${k}</div><div class="v ${cls || ""}">${v}</div></div>`).join("") + `</div>`;

function renderGale() {
  const g = gale || {}, n = naive || {};
  const chip = $("galechip");
  const ready = canon.startsWith("canon ready") && n.ready;
  chip.disabled = !ready || !!g.running;
  chip.textContent = g.running ? "▶ gale · running" : ready ? "▶ gale" : "▶ gale · waiting for canon";
  if (g.running) galeDismissed = false;
  const active = !!g.running || (!!g.finished && !galeDismissed);
  document.querySelector(".page").classList.toggle("galing", active);
  $("moral").classList.toggle("show", active && !!g.finished && !galeDismissed);
  if (!active) return;

  // gale bar
  const pct = g.total ? Math.min(100, (100 * g.sent) / g.total) : 0;
  const phase = g.phase === "draining" ? `<b>naive arm still counting…</b> behind ${fmtS(n.behind_ms || 0)}`
              : g.phase === "done" ? `<b>gale done</b>` : `<b>▶ gale</b>`;
  $("galebar").innerHTML = `${phase}<span>${g.rate} edits/s</span><span>${g.sent} / ${g.total}</span><span>${clock(g.elapsed_ms || 0)}</span>` +
    `<span class="track"><i style="width:${pct}%"></i></span><span>same script → both arms · seed ${g.seed}</span>`;

  // naive lane: same painter, hatched where its text lags fold's
  const foldText = new Map(state.rows.map((r) => [r.id, r.text]));
  const rows = n.rows || [];
  const maxW = Math.max(1, ...rows.map((r) => r.words));
  $("naivedoc").replaceChildren(...rows.map((r) => {
    const s = document.createElement("span");
    const stale = foldText.has(r.id) && foldText.get(r.id) !== r.text;
    s.className = "s" + (stale ? " stale" : "");
    s.textContent = r.text + " ";
    s.style.background = paint(r, maxW);
    s.title = (r.voice ? `voice · ${r.voice.title} · ` : "") + `t=${(r.t || 0).toFixed(2)} · ${r.words} words` + (stale ? " · stale" : "");
    return s;
  }));
  const behind = n.behind_ms || 0;
  $("naivenote").textContent = `re-embeds every row · rescans ${(n.canon_n || 0).toLocaleString()} canon vectors per row · ` +
    (behind > 200 ? `behind by ${fmtS(behind)}` : "keeping up");

  // instrument tiles
  // completed updates within the run; the post-run restore edits are not part of the race
  const foldDone = Math.min(Math.max(0, (state.seq || 0) - (g.base || 0)), g.finished ? (g.total || Infinity) : Infinity);
  const h = state.hud || {};
  $("foldtile").innerHTML = tile("Fold · doc stream · deltas", [
    // the fold arm's full per-edit cost: the wtx plus its one HNSW voice
    // refresh — the same work the naive rescan is being timed on
    ["last delta", fmtUs((h.wall_us || 0) + (h.voice_us || 0))],
    ["completed", foldDone],
    ["dropped", 0, "dim"],
    ["rows visited", h.keys != null ? `${h.keys} of ${h.rows}` : "—", "dim"],
  ]);
  $("naivetile").innerHTML = tile("Naive arm · full rescan · no index", [
    ["last rescan", fmtUs(n.stride_us)],
    ["completed", n.completed || 0],
    ["dropped", n.dropped || 0, (n.dropped || 0) > 0 ? "crim" : "dim"],
    ["behind", fmtS(behind), behind > 200 ? "crim" : "dim"],
  ]);

  // referee
  const checks = n.referee_checks || 0, matches = n.referee_matches || 0;
  const den = n.voice_agree_den || 0, num = n.voice_agree_num || 0;
  const refCls = checks && matches === checks ? "ok" : checks ? "bad" : "";
  $("referee").innerHTML =
    `referee · <span class="${refCls}">${matches}/${checks} score digests match at the same cursor</span>` +
    (den ? ` · voice agreement ${Math.round((100 * num) / den)}% (HNSW ≈ vs exact scan, ${num}/${den})` : " · voice agreement — (waiting for the canon)") +
    `<br><span class="fn">naive arm · same scoring code · no deltas · no index — linear scan over ${(n.canon_n || 0).toLocaleString()} vectors · both arms fed the same edits on the same clock</span>`;

  // moral card
  if (g.finished && !galeDismissed) {
    const f = g.finished;
    const ratio = f.naive_stride_p50_us && f.fold_stride_p50_us ? Math.round(f.naive_stride_p50_us / f.fold_stride_p50_us) : null;
    const agree = f.voice_agree && f.voice_agree[1] ? `${Math.round((100 * f.voice_agree[0]) / f.voice_agree[1])}% (${f.voice_agree[0]}/${f.voice_agree[1]})` : "—";
    $("moralcard").innerHTML =
      `<h2>Deltas kept up. The rescan did homework.</h2>` +
      `<div>${f.sent} scripted edits at ${f.rate}/s. Fold completed <b>${f.fold_completed}</b> updates at a median <b>${fmtUs(f.fold_stride_p50_us)}</b>; ` +
      `the naive arm completed <b>${f.naive_completed}</b>, dropped <b>${f.naive_dropped}</b>, and fell <b>${fmtS(f.behind_ms_max)}</b> behind at worst` +
      (ratio ? ` — a <b>${ratio}×</b> stride ratio.` : ".") + `</div>` +
      `<div class="nums">referee · ${f.referee_matches}/${f.referee_checks} score digests matched at the same cursor<br>` +
      `voice agreement · ${agree} — HNSW (approximate) vs exact scan<br>` +
      `canon · ${(f.canon_n || 0).toLocaleString()} sentences · fold median ${fmtUs(f.fold_stride_p50_us)} · naive median ${fmtUs(f.naive_stride_p50_us)}</div>` +
      `<div class="disc">disclosure: replay at ${f.rate} edits/s for ${f.secs}s, seed ${f.seed} · positions are completed updates, strides wall-clock · ` +
      `both arms fed the same edits on the same clock · naive arm scopes the ANN index out (linear scan) — nothing scripted</div>` +
      `<button id="moraldismiss">dismiss</button>`;
    $("moraldismiss").onclick = () => { galeDismissed = true; renderGale(); };
  }
}

$("galechip").onclick = async () => {
  try {
    const r = await fetch("/gale?rate=60&secs=10");
    const j = await r.json();
    if (j.status !== "started") { $("galechip").textContent = `▶ gale · ${j.status}`; }
  } catch { /* server gone; ws banner covers it */ }
};

let ws;
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    state = m.doc; canon = m.canon;
    naive = m.naive; gale = m.gale;
    render();
    renderGale();
    maybeDemo();
  };
  ws.onclose = () => {
    $("hudl").innerHTML = '<span class="dead">stream down — waiting for relaunch (the doc is on disk)</span>';
    setTimeout(connect, 800);
  };
}
connect();
</script>
