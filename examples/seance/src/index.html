<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>séance</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #0b0e0c; color: #cfd8cf;
    font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    margin: 2rem auto; max-width: 1150px; padding: 0 1rem;
  }
  h1 { font-weight: normal; letter-spacing: .35em; color: #9fe8b8; margin-bottom: .2rem; }
  .meta { color: #8a978c; margin: .3rem 0 .9rem; min-height: 1.4em; }
  .meta b { color: #cfd8cf; font-weight: 600; }
  #slider { width: 100%; accent-color: #9fe8b8; margin-top: .6rem; }
  #stats { display: flex; flex-wrap: wrap; gap: 1.6rem; color: #8a978c; margin: .4rem 0 .9rem; }
  #stats b { color: #9fe8b8; }
  #exts { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; margin-bottom: 1.1rem; }
  .ext { min-width: 92px; font-size: 12px; color: #8a978c; }
  .ext .bar { background: #1d2a20; height: 6px; border-radius: 3px; margin-top: 2px; }
  .ext .bar i { display: block; background: #9fe8b8; height: 6px; border-radius: 3px; }
  input[type=search] {
    width: 100%; box-sizing: border-box;
    background: #11150f; color: #cfd8cf; border: 1px solid #2a332c;
    padding: .55rem .8rem; font: inherit; border-radius: 4px;
  }
  input[type=search]:focus { outline: 1px solid #9fe8b8; }
  .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.3rem; margin-top: 1.1rem; }
  .col h3 {
    color: #8a978c; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .18em;
    border-bottom: 1px solid #2a332c; padding-bottom: .4rem; margin-bottom: .2rem;
  }
  .hit { margin: .55rem 0; }
  .hit .path { color: #9fe8b8; word-break: break-all; }
  .hit .score { color: #5c6b5e; margin-left: .4rem; font-size: 12px; }
  .hit .snip { color: #8a978c; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>SÉANCE</h1>
<div class="meta" id="repo">reaching across the veil…</div>

<input id="slider" type="range" min="0" max="0" value="0">
<div class="meta" id="commit"></div>
<div id="stats"></div>
<div id="exts"></div>

<input id="q" type="search" placeholder="ask the departed… (bm25 + ese→hnsw, fused)" autofocus>

<div class="cols">
  <div class="col"><h3>hybrid — rrf</h3><div id="hybrid"></div></div>
  <div class="col"><h3>keyword — bm25</h3><div id="keyword"></div></div>
  <div class="col"><h3>semantic — hnsw</h3><div id="semantic"></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const ws = new WebSocket(`ws://${location.host}/ws`);
const send = (m) => { if (ws.readyState === 1) ws.send(JSON.stringify(m)); };

// trailing throttle so dragging the slider coalesces into a stream of
// jumps the server can keep up with
let lastSent = 0, queued = null;
const sendGoto = (i) => {
  const now = performance.now();
  clearTimeout(queued);
  if (now - lastSent > 50) { lastSent = now; send({ goto: i }); }
  else queued = setTimeout(() => { lastSent = performance.now(); send({ goto: i }); }, 60);
};
$("slider").addEventListener("input", () => sendGoto(+$("slider").value));

let qTimer = null;
$("q").addEventListener("input", () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => send({ query: $("q").value }), 120);
});

const renderHits = (el, list) => {
  el.replaceChildren(...list.map((h) => {
    const d = document.createElement("div");
    d.className = "hit";
    d.innerHTML = `<span class="path"></span><span class="score"></span><div class="snip"></div>`;
    d.querySelector(".path").textContent = h.path;
    d.querySelector(".score").textContent = h.score.toFixed(3);
    d.querySelector(".snip").textContent = h.snippet;
    return d;
  }));
};

ws.onmessage = (e) => {
  const m = JSON.parse(e.data);

  if (m.total !== undefined) { // hello
    $("repo").textContent = `${m.repo} — ${m.total} commits on the first-parent line`;
    $("slider").max = m.total - 1;
    return;
  }

  if (document.activeElement !== $("slider")) $("slider").value = m.cursor;

  const when = m.at ? new Date(m.at * 1000).toISOString().slice(0, 10) : "";
  const c = $("commit");
  c.innerHTML = `<b></b> <span></span> · <span></span> · ${when}`;
  const [oid, subject, author] = c.querySelectorAll("b, span");
  oid.textContent = m.oid;
  subject.textContent = m.subject;
  author.textContent = m.author;

  $("stats").innerHTML =
    `<span><b>${m.files}</b> files</span>` +
    `<span><b>${m.lines.toLocaleString()}</b> lines</span>` +
    `<span>last jump: <b>${m.changed}</b> paths re-indexed in <b>${m.apply_ms}</b> ms</span>`;

  const max = Math.max(1, ...m.by_ext.map(([, n]) => n));
  $("exts").replaceChildren(...m.by_ext.map(([ext, n]) => {
    const d = document.createElement("div");
    d.className = "ext";
    d.innerHTML = `<div></div><div class="bar"><i style="width:${(100 * n / max).toFixed(1)}%"></i></div>`;
    d.firstChild.textContent = `${ext} · ${n}`;
    return d;
  }));

  renderHits($("hybrid"), m.hybrid);
  renderHits($("keyword"), m.keyword);
  renderHits($("semantic"), m.semantic);
};
</script>
</body>
</html>
