[package]
name = "seance"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "seance"

[dependencies]
anny = { path = "../../anny" }
fjall = "3.1.6"
axum = { version = "0.8", features = ["ws"] }
ese = { path = "../../ese", features = ["dim-512", "quant-8", "rayon"] }
fold = { path = "../../fold" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
