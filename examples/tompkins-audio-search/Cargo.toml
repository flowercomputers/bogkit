[package]
name = "tompkins-audio-search"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anny = { path = "../../anny" }
ese = { path = "../../ese", features = ["dim-512", "quant-8"] }
fold = { path = "../../fold" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["full"] }
csv = "1"
blake3 = "1"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
